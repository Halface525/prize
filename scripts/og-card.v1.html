<!doctype html>
<!--
  分享卡源（1200×630）。

  这是 og.png 的可再生成源文件，不是页面的一部分 —— 微信、GitHub Social preview
  都不执行 JS，分享预览必须是静态图，所以只能靠截图产出位图。

  重新出图：
    "<Chrome>" --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --user-data-dir=<临时目录> \
      --screenshot=public/og.png scripts/og-card.html

  刻意不写任何会变的数字（余额、期次、日期）—— 这张卡是常设的，
  否则每开一次奖就得重出一次图。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Serif+SC:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --cream: #f5f2ec;
        --ink: #111111;
        --gold: #a87c1f;
        --goldlight: #c9a961;
        --navy: #1b2a6b;
        --muted: #6b6b6b;
        --line: #e8e5e0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: var(--cream);
        color: var(--ink);
        font-family: "Noto Serif SC", "Source Han Serif SC", serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 纸纹理：与 .hero-card::before 同一套近似，只是密度按 1200×630 重算 */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(200, 170, 100, 0.09) 0 1px, transparent 1px),
          radial-gradient(circle at 70% 60%, rgba(120, 100, 60, 0.06) 0 1px, transparent 1px);
        background-size: 24px 24px, 32px 32px;
      }

      /* 装饰：右下的半个金色圆，呼应 favicon 的「半面」母题 */
      .emblem-bg {
        position: absolute;
        right: -180px;
        bottom: -250px;
        width: 580px;
        height: 580px;
        pointer-events: none;
      }

      .row-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .eyebrow {
        font-family: "Playfair Display", serif;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .est {
        font-family: "Playfair Display", serif;
        font-size: 19px;
        letter-spacing: 0.14em;
        color: var(--gold);
      }

      .masthead {
        position: relative;
      }

      h1 {
        font-size: 104px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.06em;
        margin-bottom: 22px;
      }

      .latin {
        font-family: "Playfair Display", serif;
        font-size: 40px;
        font-weight: 400;
        color: var(--gold);
        letter-spacing: 0.02em;
        margin-bottom: 34px;
      }

      .rule {
        width: 132px;
        height: 2px;
        background: var(--goldlight);
        margin-bottom: 34px;
      }

      .tagline {
        font-size: 34px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.04em;
      }

      .tagline em {
        font-style: normal;
        color: var(--gold);
        font-weight: 700;
      }

      .row-bottom {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .facts {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 21px;
        color: var(--muted);
        letter-spacing: 0.03em;
      }

      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--goldlight);
      }

      .contact {
        text-align: right;
      }

      .contact .label {
        font-family: "Playfair Display", serif;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .contact .addr {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        color: var(--navy);
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="emblem-bg" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="99" fill="none" stroke="#c9a961" stroke-width="1" opacity="0.55" />
        <path d="M100 1a99 99 0 0 0 0 198z" fill="#c9a961" opacity="0.14" />
      </svg>

      <div class="row-top">
        <div class="brand">
          <svg width="46" height="46" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="#1b2a6b" />
            <path d="M16 3a13 13 0 0 0 0 26z" fill="#c9a961" />
          </svg>
          <span class="eyebrow">The Halface Prize</span>
        </div>
        <span class="est">EST. 2026</span>
      </div>

      <div class="masthead">
        <h1>半面奖</h1>
        <div class="latin">The Halface Prize</div>
        <div class="rule"></div>
        <div class="tagline">不奖励优绩，<em>只奖励有趣</em>。</div>
      </div>

      <div class="row-bottom">
        <div class="facts">
          <span>每周五 A 股收盘后开奖</span>
          <span class="dot"></span>
          <span>奖金为账户全部余额</span>
          <span class="dot"></span>
          <span>开奖后归零</span>
        </div>
        <div class="contact">
          <div class="label">Apply</div>
          <div class="addr">halface16@gmail.com</div>
        </div>
      </div>
    </div>
  </body>
</html>
